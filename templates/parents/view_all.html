<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View All Parents</title>
</head>
<body>
    <table>
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Phone #1</th>
            <th>Phone #2</th>
        </tr>

        {% for parent in parents %}
            <tr>
                <th>{{parent.id}}</th>
                <th>{{parent.first_name}}</th>
                <th>{{parent.last_name}}</th>
                <th>{{parent.email}}</th>
                <th>{{parent.profile.user_phone_1}}</th>
                <th>{{parent.profile.user_phone_2}}</th>
            </tr>
        {% endfor %}
    </table>
</body>
</html>
