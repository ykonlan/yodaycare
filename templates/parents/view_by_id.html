<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Parent</title>
</head>
<body>
    <form action="{% url 'update-parent' pk=parent.id %}" method="post">
        {% csrf_token %}

        {{parent_form.as_p}}

        {{parent_profile_form.as_p}}

        <button type="submit">Submit</button>
    </form>

    {% if parent_wards %}
        <table>
            <tr>
                <th>Ward Name</th>
                <th>Ward Class</th>
            </tr>
            {% for ward in parent_wards %}
                <tr>
                    <td><a href="{% url 'update-ward' pk=ward.id %}">{{ward.ward_name}}</a></td>
                    <td>{{ward.ward_class}}</td>
                </tr>
            {% endfor %}
    {% endif %}
        </table>
</body>
</html>

{% if messages %}
    {% for message in messages %}
        <script>
            alert("{{ message|escapejs }}");
        </script>
    {% endfor %}
{% endif %}
