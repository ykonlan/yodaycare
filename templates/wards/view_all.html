<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View All Wards</title>
</head>
<body>
    <table>
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Ward Class</th>
            <th>Ward Parent</th>
        </tr>

        {% for ward in wards %}
            <tr>
                <th>{{ward.id}}</th>
                <th>{{ward.ward_name}}</th>
                <th>{{ward.ward_class}}</th>
                <th>{{ward.ward_parent}}</th>
            </tr>
        {% endfor %}
    </table>
</body>
</html>
