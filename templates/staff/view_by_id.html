{% extends "base.html" %}

{% block title %}Edit Staff | YoDayCare{% endblock %}

{% block content %}

<div class="edit-staff-page">

    <div class="page-header">
        <h1>Edit Staff</h1>
        <p>Update the staff member's information.</p>
    </div>

    <section class="form-section">
        <form action="{% url 'update-staff' pk=staff.id %}" method="post">
            {% csrf_token %}

            <div class="staff-form">
                {{ staff_form.as_p }}
            </div>

            <div class="user-profile-form">
                {{ user_profile_form.as_p }}
            </div>

            <div class="staff-profile-form">
                {{ staff_profile_form.as_p }}
            </div>

            <button type="submit">Save Changes</button>
        </form>
    </section>

</div>

{% endblock %}
